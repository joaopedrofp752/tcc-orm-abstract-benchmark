# Application Configuration
spring.application.name=tcc-backend
server.port=8080

# Enable Java 21+ Virtual Threads (Project Loom)
spring.threads.virtual.enabled=true

# Logging Configuration (Suppresses console I/O overhead during load tests)
logging.level.root=WARN
logging.level.cest.joaopedrofp.tcc_backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN

# PostgreSQL Connection Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tcc_benchmark
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration (Fixed size prevents connection resizing overhead)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.pool-name=HikariCP-Hibernate-DTO

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false